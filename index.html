<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title> audio visualiser </title>
        <style>
            /* basic styling */
            body {
                background-color: #121212;
                color: white;
                font-family: Arial, Helvetica, sans-serif;
                text-align: center;
                margin-top: 50px;
            }

            #visualizer {
                background: #000;
                border: 2px solid #333; 
                border-radius: 5px;
                width: 600px;
                height: 250px;
            }

            .controls {
                margin-top: 15px; 
            }
        </style>
    </head>
    <body>
        <h2> Audio Visualiser Project </h2>
        <p> Play the audio to start the frequency bars </p>
        
        <canvas id="visualizer"></canvas>

        <div class="controls">

            <audio id="myAudio" controls src="Epoq-Lepidoptera.ogg"></audio>
        </div>

        <script src="script.js"></script>
    </body>
</html>
