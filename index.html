<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Audio Visualizer</title>
        <style>
            /* Basic styling */
            body {
                background-color: #121212;
                color: white;
                font-family: Arial, Helvetica, sans-serif;
                text-align: center;
                margin-top: 30px;
            }

            #visualizer {
                background: #000;
                border: 2px solid #333; 
                border-radius: 5px;
                width: 600px;
                height: 250px;
            }

            .controls {
                margin-top: 20px; 
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 15px;
            }

            .control-group {
                display: flex;
                gap: 15px;
                align-items: center;
                background: #1e1e1e;
                padding: 10px 20px;
                border-radius: 8px;
                border: 1px solid #333;
            }

            label {
                font-size: 0.9rem;
                color: #ccc;
            }

            input[type="file"] {
                color: #ccc;
            }
        </style>
    </head>
    <body>
        <h2>Audio Visualizer Project</h2>
        <p>Play audio or upload a local file to view frequency bars</p>
        
        <canvas id="visualizer"></canvas>

        <div class="controls">
            <!-- Audio Player -->
            <audio id="myAudio" controls src="Epoq-Lepidoptera.ogg"></audio>

            <!-- File Upload -->
            <div class="control-group">
                <label for="audioFile">Local File:</label>
                <input type="file" id="audioFile" accept="audio/*">
            </div>

            <!-- Customization Controls -->
            <div class="control-group">
                <label for="colorPicker">Color:</label>
                <input type="color" id="colorPicker" value="#00c8c8">

                <label for="sensitivity">Sensitivity:</label>
                <input type="range" id="sensitivity" min="0.5" max="2.5" step="0.1" value="1">

                <label for="barDensity">Bar Count:</label>
                <select id="barDensity">
                    <option value="64">32 Bars</option>
                    <option value="128" selected>64 Bars</option>
                    <option value="256">128 Bars</option>
                </select>
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
