<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title> audio visualiser </title>
        <style>
            /* basic styling */
            body {
      background-color: #121212;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
      margin-top: 50px;
    }

    #visualizer {
        background: #000;
        border: 2px solid #333; 
        border-radius: 5px;
      /* hardcoded width for now */
      width: 600px;
      height: 250px;
    }

    .controls {
        margin-top: 15px; 
    }
        </style>
    </head>
    <body>
        <h2> Audio Visualiser Project </h2>
        <p> Play the audio to start the frequency bars </p>
        
        <canvas id="visualizer"></canvas>

        <div class="controls">
    <!-- using a public audio link I found online -->
    <audio id="myAudio" controls src="https://commondatastorage.googleapis.com/codeskulptor-assets/Epoq-Lepidoptera.ogg" crossorigin="anonymous"></audio>
  </div>
    </body>
</html>
